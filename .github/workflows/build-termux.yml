# Builds the opencode v2 CLI (packages/cli) as a self-contained linux/arm64 Bun
# standalone, then publishes it to a rolling "termux-build" release so the
# phone can install it with termux/install-termux.sh.
#
# Replaces the previous workflow, which ran `go build .` — this repo has no Go
# code and no go.mod; the build entrypoint is packages/cli/script/build.ts.

name: build-termux

# Manual only, on purpose. The binary churns a ~200 MB release asset on every
# run, so it should not rebuild itself every time termux/** changes.
# Uncomment the `push:` block below to get auto-rebuilds back.
on:
  workflow_dispatch:
    inputs:
      skip_web_ui:
        description: "Skip embedding the web UI (faster build; `opencode web` will serve nothing)"
        type: boolean
        default: false
      publish_release:
        description: "Publish the binary to the rolling termux-build release"
        type: boolean
        default: true
  # push:
  #   branches: [dev]
  #   paths:
  #     - ".github/workflows/build-termux.yml"
  #     - "termux/**"

permissions:
  contents: write

concurrency:
  group: build-termux-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the build self-contained and deterministic: no npm version lookup,
  # no release notes, quoted-nothing preview channel.
  OPENCODE_CHANNEL: termux
  # The Bun runtime that gets embedded must be 1.4.2 (package.json pin).
  BUN_COMPILE_RELEASE: bun-v1.4.2
  OUT_BIN: packages/cli/dist/cli-linux-arm64/bin/opencode

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Installs Bun 1.4.2 (from package.json packageManager) + Node 24 and
      # runs `bun install --frozen-lockfile`.
      - uses: ./.github/actions/setup-bun

      # Cross-compiles to linux/arm64. build.ts also re-installs @opentui/core
      # and @opencode-ai/pty with --os="*" --cpu="*", which is what makes the
      # arm64 native bits end up in an x64-hosted cross build.
      - name: Build CLI (linux/arm64)
        run: |
          bun ./packages/cli/script/build.ts \
            --target=opencode-linux-arm64 \
            ${{ inputs.skip_web_ui && '--skip-web-ui' || '' }}

      - name: Inspect artifact
        run: |
          set -eux
          ls -lh "$OUT_BIN"
          file "$OUT_BIN"
          readelf -l "$OUT_BIN" | grep -i interpreter || true

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-arm64
          path: ${{ env.OUT_BIN }}
          if-no-files-found: error
          # Already a ~200 MB executable; compressing it only burns minutes.
          compression-level: 0

      # Rolling release: tag "termux-build" is recreated on every run, so the
      # install URL stays stable:
      #   https://github.com/<owner>/<repo>/releases/download/termux-build/opencode
      # Rewrite PT_INTERP here, not on the phone. Termux's patchelf-glibc is
      # frequently unusable on-device ("libc.so: invalid ELF header"), and the
      # Termux prefix is a constant, so the artifact ships pre-patched.
      - name: Patch interpreter for Termux
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --set-interpreter /data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1 "$OUT_BIN"
          readelf -l "$OUT_BIN" | grep -i interpreter
          grep -aqF /data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1 "$OUT_BIN"
          echo "interpreter points at Termux glibc"

      # 209 MB -> 98 MB with gzip -9, which is ~111 MB less mobile data per
      # install. gzip is in the Termux base install, so decoding is free.
      - name: Compress
        run: |
          set -eux
          gzip -9 -c "$OUT_BIN" > opencode.gz
          sha256sum opencode.gz > opencode.gz.sha256
          ls -l opencode.gz
          cat opencode.gz.sha256

      # Rolling release. Deliberately does NOT delete/recreate: that churn left
      # the release stuck as a DRAFT (asset URL 404s for everyone) on run #4.
      # Create once, then upload --clobber, then force it public and verify
      # that an unauthenticated client can actually fetch it.
      - name: Publish rolling release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          cat > notes.md <<'NOTES'
          Self-contained Bun standalone for Termux / Android aarch64.

          `opencode.gz` is the linux/arm64 CLI, gzipped (209 MB -> 98 MB). The
          ELF interpreter is already rewritten to
          `/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1`, so
          no patchelf runs on the phone. `opencode.gz.sha256` is verified by the
          installer.

          Install (about 122 MB of data in total):

          ```
          curl -fsSL https://raw.githubusercontent.com/__OWNER_REPO__/dev/termux/install-termux.sh -o install-termux.sh
          bash install-termux.sh
          ```
          NOTES
          sed -i "s|__OWNER_REPO__|${GITHUB_REPOSITORY}|" notes.md

          if gh release view termux-build >/dev/null 2>&1; then
            gh release upload termux-build opencode.gz opencode.gz.sha256 --clobber
            gh release edit termux-build --draft=false --prerelease=false --notes-file notes.md
          else
            gh release create termux-build opencode.gz opencode.gz.sha256 \
              --title "Termux build (linux/arm64)" --notes-file notes.md --latest=false
          fi

      # Regression guard: a draft release serves 404 to everyone but a token
      # holder. Fail loudly here instead of on someone's phone.
      - name: Verify the release is publicly downloadable
        if: inputs.publish_release
        run: |
          set -eux
          URL="https://github.com/${{ github.repository }}/releases/download/termux-build/opencode.gz"
          for i in 1 2 3 4 5; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$code" = "200" ] && { echo "public: $URL"; exit 0; }
            echo "attempt $i: HTTP $code, retrying in 15s"; sleep 15
          done
          echo "::error::$URL is not publicly downloadable (release is probably a draft)"
          exit 1

      - name: Summary
        run: |
          {
            echo "### opencode for Termux"
            echo ""
            echo "- binary: \`$OUT_BIN\`"
            echo "- download: https://github.com/${{ github.repository }}/releases/download/termux-build/opencode.gz (~98 MB)"
            echo ""
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/dev/termux/install-termux.sh -o install-termux.sh"
            echo "bash install-termux.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
